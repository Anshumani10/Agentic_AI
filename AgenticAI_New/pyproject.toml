[project]
name = "agenticai-new"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dataclasses>=0.8",
    "email-validator>=2.3.0",
    "gradio>=6.26.0",
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
    "langchain>=1.3.18",
    "openai>=3.7.0",
    "openai-agents>=0.22.3",
    "pydantic>=2.13.5",
    "pypdf>=6.17.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sendgrid>=6.12.5",
    "tensorflow>=2.21.0",
]

[project.scripts]
agenticai-new = "agenticai_new:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
